name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, test, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Dependency vulnerability audit
        # Blocking: dotnet list package --vulnerable is currently clean. Exits non-zero via grep
        # if a future dependency bump introduces a known-vulnerable package.
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet packages found - see output above."
            exit 1
          fi

  frontend:
    name: Frontend (build, lint, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Dependency vulnerability audit
        # Non-blocking: react-router-dom currently has one known High advisory
        # (GHSA-qwww-vcr4-c8h2) with no patched version released yet - see
        # docs/09-Security-Hardening.md. Runs so new advisories are visible in the log without
        # permanently failing CI on an unfixable one.
        run: npm audit --audit-level=high
        continue-on-error: true
