services:
  mysql:
    image: mysql:8.0
    container_name: padel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-padel_booking}
      MYSQL_USER: ${MYSQL_USER:-padel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    ports:
      # Bound to localhost only — this is a local dev database with a well-known default password
      # (see .env.example); it should never be reachable from outside the host.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./database/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me}"]
      interval: 5s
      timeout: 5s
      retries: 10
